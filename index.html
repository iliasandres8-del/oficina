<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leonida Clips · Oficina</title>
<meta name="theme-color" content="#0b0718">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Oficina">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root {
  --fondo: #0b0718; --lado: #0e0920; --panel: #150e2a; --panel2: #1e1538; --borde: #2c2150;
  --texto: #f4efff; --suave: #a79ecb; --tenue: #6f6696;
  --sol2: #ff8a3d; --sol3: #ff4f8b;
  --verde: #3ddc97; --rojo: #ff5470; --amarillo: #ffd23f;
  --degradado: linear-gradient(120deg, #ffb03b, #ff6b5b 50%, #ff4f8b);
  --inclinar: 58deg; --girar: -40deg;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body { background: var(--fondo); color: var(--texto); font-family: "Space Grotesk", system-ui, sans-serif; }
body { overflow-x: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--sol2); outline-offset: 2px; }

/* ---------- distribución ---------- */
.app { display: grid; grid-template-columns: 1fr 420px; grid-template-rows: auto 1fr; height: 100vh; height: 100dvh; }
.escena-caja { position: relative; overflow: hidden; min-height: 0;
  background: radial-gradient(ellipse 75% 65% at 50% 40%, #2b1150 0%, #170a33 42%, var(--fondo) 78%); }
.lateral { border-left: 1px solid var(--borde); background: var(--lado); display: flex; flex-direction: column; min-height: 0; }

/* ---------- barra de arriba ---------- */
.barra { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 20px; padding-top: max(12px, env(safe-area-inset-top)); border-bottom: 1px solid var(--borde);
  background: rgba(11, 7, 24, .88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 20; }
.marca { display: flex; align-items: center; gap: 11px; min-width: 0; }
.marca img { width: 42px; height: 42px; border-radius: 11px; flex: none; }
.marca > div { min-width: 0; }
.marca h1 { font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 23px; letter-spacing: .03em; line-height: 1; }
.marca h1 span { background: var(--degradado); -webkit-background-clip: text; background-clip: text; color: transparent; }
.marca p { color: var(--suave); font-size: 12.5px; margin-top: 4px; display: flex; align-items: center; gap: 6px; }
.marca p span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.marca p i { width: 7px; height: 7px; border-radius: 50%; background: var(--tenue); flex: none; }
.marca p.vivo i { background: var(--verde); box-shadow: 0 0 8px var(--verde); animation: latir 1.2s infinite; }
.contador { display: flex; gap: 8px; align-items: center; flex: none; }
.meta-dia, .chip { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border: 1px solid var(--borde); border-radius: 999px; background: var(--panel); color: var(--texto); }
.anillo { --p: 0; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; position: relative;
  background: conic-gradient(var(--sol2) calc(var(--p) * 1%), #2a1f48 0); }
.anillo::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--panel); }
.anillo b { position: relative; font-size: 12px; font-variant-numeric: tabular-nums; }
.meta-dia span, .chip span { font-size: 12px; color: var(--suave); line-height: 1.15; text-align: left; }
.chip b { min-width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; background: #2a1f48; font-variant-numeric: tabular-nums; }
.chip.hay b { background: var(--degradado); color: #1a0612; }

/* ---------- la oficina 3D ---------- */
.escena-caja canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: grab; }
.escena-caja canvas:active { cursor: grabbing; }
.cargando3d { position: absolute; inset: 0; display: grid; place-items: center; color: var(--suave); font-size: 13px; }
.rotulos { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.rotulo { position: absolute; left: 0; top: 0; display: grid; justify-items: center; gap: 6px; will-change: transform; }
.chip3 { display: flex; align-items: center; gap: 6px; white-space: nowrap; background: rgba(20, 12, 40, .9); border: 1.5px solid var(--c); border-radius: 999px;
  padding: 4px 10px; font-size: 12px; font-weight: 600; box-shadow: 0 6px 18px rgba(0, 0, 0, .45); }
.chip3 i { width: 7px; height: 7px; border-radius: 50%; background: var(--tenue); flex: none; }
.rotulo.trabajando .chip3 i { background: var(--verde); box-shadow: 0 0 8px var(--verde); animation: latir 1s infinite; }
.rotulo.error .chip3 { border-color: var(--rojo); } .rotulo.error .chip3 i { background: var(--rojo); }
.rotulo.jefe .chip3 { background: var(--degradado); color: #1a0612; border-color: transparent; font-size: 13px; }
.rotulo.jefe .chip3 i { background: #1a0612; }
.burbuja { position: relative; max-width: 190px; width: max-content; background: #fff; color: #140a26; border-radius: 11px; padding: 6px 10px;
  font-size: 11.5px; font-weight: 600; line-height: 1.3; text-align: center; box-shadow: 0 6px 16px rgba(0, 0, 0, .35); }
.burbuja::after { content: ""; position: absolute; left: 50%; bottom: -4px; width: 9px; height: 9px; background: #fff; translate: -50% 0; rotate: 45deg; border-radius: 2px; }
.burbuja:empty { display: none; }
.aviso-ok { position: absolute; top: 12px; left: 50%; translate: -50% 0; z-index: 3; display: flex; align-items: center; gap: 10px; width: max-content; max-width: calc(100% - 24px);
  background: rgba(255, 210, 63, .96); color: #1a0612; border-radius: 14px; padding: 7px 7px 7px 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, .4); font-size: 13px; }
.aviso-ok b { white-space: nowrap; } .aviso-ok span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.aviso-ok button { border: 0; background: #1a0612; color: #fff; border-radius: 10px; padding: 7px 12px; font-weight: 700; flex: none; }
.pista { position: absolute; bottom: 10px; left: 50%; translate: -50% 0; font-size: 11px; color: var(--suave); background: rgba(11, 7, 24, .6); padding: 4px 10px; border-radius: 999px; pointer-events: none; white-space: nowrap; }

@keyframes latir { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- panel lateral ---------- */
.pestanas { display: flex; gap: 4px; margin: 14px 14px 0; padding: 4px; background: var(--panel); border: 1px solid var(--borde); border-radius: 14px; }
.pestanas button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; background: transparent; color: var(--suave);
  border: 0; border-radius: 10px; padding: 10px 6px; font-size: 14px; font-weight: 600; transition: background .2s, color .2s; }
.pestanas button[aria-selected="true"] { background: var(--degradado); color: #1a0612; }
.pestanas .num { background: var(--sol3); color: #fff; border-radius: 999px; min-width: 19px; padding: 1px 6px; font-size: 11px; font-weight: 700; }
.pestanas button[aria-selected="true"] .num { background: #1a0612; }
.vista { padding: 14px; overflow-y: auto; overflow-x: hidden; flex: 1; display: none; }
.vista.activa { display: block; }
.vacio { display: grid; justify-items: center; gap: 8px; color: var(--suave); font-size: 14px; text-align: center; padding: 34px 18px; line-height: 1.5;
  border: 1px dashed var(--borde); border-radius: 16px; }
.vacio svg { width: 36px; height: 36px; color: var(--sol2); }
.vacio b { color: var(--texto); font-size: 15px; }

.nota { display: flex; gap: 11px; background: var(--panel); border: 1px solid var(--borde); border-radius: 14px; padding: 11px 12px; margin-bottom: 8px; }
.nota .icono { width: 34px; height: 34px; border-radius: 10px; flex: none; display: grid; place-items: center; font-size: 16px; background: #2a1d4f; }
.nota.ok .icono { background: #113c2e; } .nota.error .icono { background: #4a1426; } .nota.aviso .icono { background: #4a3410; }
.nota > div:last-child { min-width: 0; }
.nota b { font-size: 13px; display: block; } .nota p { font-size: 13px; color: #d4cdf0; margin-top: 2px; line-height: 1.4; overflow-wrap: anywhere; }
.nota time { font-size: 11px; color: var(--tenue); }
.nota.nueva { animation: entrar .5s ease-out; }
@keyframes entrar { from { transform: translateX(20px); opacity: 0; } }

.tarjeta { background: var(--panel); border: 1px solid var(--borde); border-radius: 18px; overflow: hidden; margin-bottom: 14px; }
.tarjeta video { width: 100%; aspect-ratio: 9 / 16; max-height: 62vh; background: #000; display: block; object-fit: contain; }
.tarjeta .info { padding: 14px; }
.tarjeta .gancho { font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 21px; letter-spacing: .02em; line-height: 1.15; text-transform: uppercase; }
.tarjeta .meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 9px 0 10px; }
.tarjeta .meta span { font-size: 12px; color: var(--suave); background: var(--panel2); border-radius: 999px; padding: 4px 9px; }
.tarjeta .tit { font-size: 14px; color: #d4cdf0; line-height: 1.4; }
.botones { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; margin-top: 14px; }
.botones button { border: 0; border-radius: 12px; padding: 13px; font-weight: 700; font-size: 15px; transition: transform .12s; }
.botones button:active { transform: scale(.97); }
.si { background: var(--verde); color: #04140d; } .no { background: var(--panel2); color: var(--texto); }

.fuente { display: flex; gap: 11px; align-items: center; background: var(--panel); border: 1px solid var(--borde); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; font-size: 15px; font-weight: 600; }
.fuente .avatar { width: 38px; height: 38px; border-radius: 50%; flex: none; display: grid; place-items: center; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 17px; background: var(--degradado); color: #1a0612; text-transform: uppercase; }
.fuente.pausa .avatar { background: #2a1f48; color: var(--suave); }
.fuente .datos { flex: 1; min-width: 0; }
.fuente small { color: var(--suave); display: block; font-weight: 400; font-size: 12px; margin-top: 2px; }
.fuente button { background: transparent; border: 1px solid var(--borde); color: var(--suave); border-radius: 9px; padding: 7px 11px; font-size: 12px; font-weight: 600; flex: none; }
form.agregar { display: grid; gap: 8px; margin-top: 16px; padding: 14px; background: var(--panel); border: 1px solid var(--borde); border-radius: 16px; }
form.agregar h3 { font-size: 14px; margin-bottom: 2px; }
input, select { width: 100%; background: var(--fondo); border: 1px solid var(--borde); color: var(--texto); border-radius: 11px; padding: 12px; font: inherit; font-size: 16px; }
input::placeholder { color: var(--tenue); }
form button[type=submit] { background: var(--degradado); color: #1a0612; border: 0; border-radius: 11px; padding: 13px; font-weight: 700; font-size: 15px; }

.entrar { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px;
  background: radial-gradient(ellipse at 50% 30%, #2b1150, var(--fondo) 70%); }
.entrar form { width: min(360px, 100%); display: grid; gap: 10px; background: rgba(21, 14, 42, .9); border: 1px solid var(--borde); border-radius: 22px; padding: 26px 22px 22px; text-align: center; }
.entrar img { width: 84px; height: 84px; border-radius: 22px; margin: 0 auto 6px; box-shadow: 0 10px 40px rgba(255, 79, 139, .35); }
.entrar h2 { font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 26px; letter-spacing: .03em; }
.entrar p { color: var(--suave); font-size: 13px; margin-bottom: 6px; }
.error-txt { color: var(--rojo); font-size: 13px; min-height: 1em; }

/* ---------- celular (va al final para ganarle a lo de arriba) ---------- */
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto auto; height: auto; min-height: 100dvh; }
  .barra { padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); }
  .marca img { width: 38px; height: 38px; border-radius: 10px; }
  .marca h1 { font-size: 20px; }
  .meta-dia, .chip { padding: 3px; }
  .meta-dia span, .chip span { display: none; }
  .escena-caja { height: 54vh; min-height: 340px; }
  .chip3 { font-size: 10.5px; padding: 3px 8px; gap: 5px; }
  .rotulo:not(.jefe):not(.trabajando):not(.error) .nom { display: none; }
  .rotulo:not(.jefe):not(.trabajando):not(.error) .chip3 { padding: 3px 6px; }
  .rotulo.admin .burbuja { display: none; }
  .rotulo.jefe .chip3 { font-size: 11.5px; }
  .burbuja { font-size: 10.5px; max-width: 140px; padding: 5px 8px; }
  .lateral { border-left: 0; border-top: 1px solid var(--borde); }
  .vista { padding: 14px 16px calc(24px + env(safe-area-inset-bottom)); }
  .pestanas { margin: 14px 16px 0; }
}
</style>
</head>
<body>
<div class="app">
  <header class="barra">
    <div class="marca">
      <img src="logo.svg" alt="" width="42" height="42">
      <div><h1>LEONIDA <span>CLIPS</span></h1><p id="estado-equipo"><i></i><span>Conectando…</span></p></div>
    </div>
    <div class="contador">
      <div class="meta-dia" title="Videos listos hoy"><div class="anillo" id="anillo"><b id="n-hoy">0/5</b></div><span>listos<br>hoy</span></div>
      <button class="chip" id="ir-ok" type="button" title="Ver los que esperan tu OK"><b id="n-ok">0</b><span>por<br>aprobar</span></button>
    </div>
  </header>

  <section class="escena-caja" aria-label="Oficina de agentes en 3D">
    <div class="cargando3d" id="cargando3d">Cargando la oficina…</div>
    <div class="rotulos" id="rotulos"></div>
    <div class="aviso-ok" id="aviso-ok" hidden><b>Espera tu OK</b><span id="aviso-txt"></span><button type="button" id="aviso-ver">Ver</button></div>
    <span class="pista">Arrastra para girar la oficina</span>
  </section>

  <aside class="lateral" id="lateral">
    <div class="pestanas" role="tablist">
      <button role="tab" aria-selected="true" data-vista="aprobar">Tu OK <span class="num" id="badge" hidden>0</span></button>
      <button role="tab" aria-selected="false" data-vista="notas">Actividad</button>
      <button role="tab" aria-selected="false" data-vista="fuentes">Streamers</button>
    </div>
    <div class="vista activa" id="aprobar"></div>
    <div class="vista" id="notas"></div>
    <div class="vista" id="fuentes">
      <div id="lista-fuentes"></div>
      <form class="agregar" id="form-fuente">
        <h3>Agregar streamer</h3>
        <select name="plataforma" aria-label="Plataforma"><option value="twitch">Twitch</option><option value="kick">Kick</option><option value="youtube">YouTube</option></select>
        <input name="canal" placeholder="Canal (ej. ibai)" aria-label="Canal" required autocomplete="off">
        <input name="campana_url" placeholder="Link de la campaña en Whop (opcional)" aria-label="Link de la campaña" autocomplete="off">
        <button type="submit">Agregar</button>
      </form>
    </div>
  </aside>
</div>

<div class="entrar" id="entrar" hidden>
  <form id="form-entrar">
    <img src="logo.svg" alt="">
    <h2>LEONIDA CLIPS</h2>
    <p>Entra a tu oficina con la cuenta de MI VIDA.</p>
    <input type="email" name="email" placeholder="Correo" autocomplete="username" required>
    <input type="password" name="clave" placeholder="Contraseña" autocomplete="current-password" required>
    <div class="error-txt" id="error-entrar"></div>
    <button type="submit">Entrar</button>
  </form>
</div>

<script>
const db = supabase.createClient("https://qzszwuiehdjndzqfbvsw.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF6c3p3dWllaGRqbmR6cWZidnN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0NzE2MTksImV4cCI6MjEwNTA0NzYxOX0.Suzr4M3EDhczpR_xeH28OomKhrYmNPZA7NABR3nLEdA");

// Equipo en el orden de la cadena de trabajo (color e icono de cada puesto).
const SALAS = {
  radar:      { linea: "#ffd23f", icono: "📡" },
  cortador:   { linea: "#ffa865", icono: "✂️" },
  copywriter: { linea: "#ff8a94", icono: "✍️" },
  editor:     { linea: "#ff86b8", icono: "🎬" },
  revisor:    { linea: "#dc8cff", icono: "🔍" },
  publicador: { linea: "#b39bff", icono: "🚀" },
  biblioteca: { linea: "#8ea2ff", icono: "🗂️" },
  analista:   { linea: "#6fe2f0", icono: "📊" },
};
window.SALAS = SALAS;
// El Revisor le entrega al Director; lo aprobado sale del Director al Publicador.
const SIGUIENTE = { radar: "cortador", cortador: "copywriter", copywriter: "editor", editor: "revisor", revisor: "director", publicador: "biblioteca" };
// Mientras carga la escena 3D, los pedidos se guardan en una cola.
window.escena3d = { cola: [] };
for (const f of ["estado", "paquete", "jefe", "admin"]) window.escena3d[f] = (...a) => window.escena3d.cola.push([f, a]);
const escena3d = (f, ...a) => window.escena3d[f](...a);
const ICONO_NOTA = { ok: "✅", error: "⚠️", aviso: "💡", info: "📡" };
const $ = (s) => document.querySelector(s);
const VACIO = (titulo, texto) => `<div class="vacio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/></svg><b>${titulo}</b><span>${texto}</span></div>`;
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let agentes = {}, clipsOk = [], meta = 5;

function pintarAgente(a) {
  agentes[a.id] = a;
  escena3d("estado", a.id, a.estado, a.tarea || (a.estado === "error" ? "Algo falló" : ""), a.nombre);
  const n = Object.values(agentes).filter((x) => x.estado === "trabajando").length;
  $("#estado-equipo").classList.toggle("vivo", n > 0);
  $("#estado-equipo span").textContent = n ? `${n} agente${n > 1 ? "s" : ""} trabajando` : "Oficina en calma · próxima vuelta pronto";
}

function enviarPaquete(desde) { if (SIGUIENTE[desde]) escena3d("paquete", desde, SIGUIENTE[desde]); }

// ---------- notificaciones ----------
function hace(f) {
  const s = (Date.now() - new Date(f)) / 1000;
  if (s < 60) return "ahora"; if (s < 3600) return `hace ${Math.floor(s / 60)} min`;
  if (s < 86400) return `hace ${Math.floor(s / 3600)} h`; return new Date(f).toLocaleDateString("es-CO");
}
function nota(e, nueva) {
  const d = document.createElement("div");
  d.className = `nota ${e.tipo}${nueva ? " nueva" : ""}`;
  d.innerHTML = `<div class="icono">${ICONO_NOTA[e.tipo] || "📡"}</div><div><b>${esc(agentes[e.agente]?.nombre || e.agente || "Oficina")}</b><p>${esc(e.mensaje)}</p><time>${hace(e.creado)}</time></div>`;
  const lista = $("#notas"); lista.querySelector(".vacio")?.remove();
  nueva ? lista.prepend(d) : lista.append(d);
}

// ---------- aprobar ----------
async function pintarAprobar() {
  const v = $("#aprobar");
  $("#n-ok").textContent = clipsOk.length;
  $("#ir-ok").classList.toggle("hay", clipsOk.length > 0);
  escena3d("jefe", clipsOk.length);
  $("#aviso-ok").hidden = !clipsOk.length;
  if (clipsOk.length) $("#aviso-txt").textContent = clipsOk.length > 1 ? `${clipsOk.length} videos listos` : clipsOk[0].copy?.gancho || "1 video listo";
  const badge = $("#badge"); badge.hidden = !clipsOk.length; badge.textContent = clipsOk.length;
  if (!clipsOk.length) { v.innerHTML = VACIO("Nada esperando tu OK", "Cuando el Revisor apruebe un clip, aparece aquí para que lo veas antes de publicarlo."); return; }
  v.innerHTML = "";
  for (const c of clipsOk) {
    const t = document.createElement("article"); t.className = "tarjeta";
    let src = "";
    if (c.preview_path) {
      const { data } = await db.storage.from("oficina").createSignedUrl(c.preview_path, 3600);
      src = data?.signedUrl || "";
    }
    t.innerHTML = `${src ? `<video src="${esc(src)}" controls playsinline preload="metadata"></video>` : ""}
      <div class="info"><div class="gancho">${esc(c.copy?.gancho)}</div>
      <div class="meta"><span>${esc(c.streamer)}</span><span>${Number(c.vistas_origen || 0).toLocaleString("es-CO")} vistas</span><span>${Math.round(c.revision?.duracion || c.duracion || 0)} s</span></div>
      <div class="tit">${esc(c.copy?.titulo)}</div>
      <div class="botones"><button class="no" data-id="${c.id}" data-d="descartado">Descartar</button><button class="si" data-id="${c.id}" data-d="aprobado">Aprobar ✓</button></div></div>`;
    v.appendChild(t);
  }
}
$("#aprobar").addEventListener("click", async (ev) => {
  const b = ev.target.closest("button[data-id]"); if (!b) return;
  b.disabled = true;
  const { error } = await db.from("of_clips").update({ estado: b.dataset.d }).eq("id", b.dataset.id);
  if (error) { alert(error.message); b.disabled = false; return; }
  if (b.dataset.d === "aprobado") escena3d("paquete", "director", "publicador");
  clipsOk = clipsOk.filter((c) => c.id !== b.dataset.id); pintarAprobar();
});

// ---------- streamers ----------
async function cargarFuentes() {
  const { data } = await db.from("of_fuentes").select("*").order("id");
  const l = $("#lista-fuentes"), activos = (data || []).filter((f) => f.activa).length;
  escena3d("admin", activos ? `${activos} streamer${activos > 1 ? "s" : ""} en la mira` : "Esperando la lista de streamers");
  l.innerHTML = (data || []).length ? "" : VACIO("Sin streamers todavía", "Agrega los streamers de GTA 6 que tengan campaña de clipping.");
  for (const f of data || []) {
    const d = document.createElement("div"); d.className = "fuente" + (f.activa ? "" : " pausa");
    d.innerHTML = `<div class="avatar">${esc(f.canal?.[0] || "?")}</div><div class="datos">${esc(f.canal)}<small>${f.activa ? "" : "pausado · "}${esc(f.plataforma)}${f.campana_url ? " · con campaña" : ""}${f.notas ? " · " + esc(f.notas) : ""}</small></div>
      <button data-f="${f.id}" data-a="${!f.activa}">${f.activa ? "Pausar" : "Activar"}</button>`;
    l.appendChild(d);
  }
}
$("#lista-fuentes").addEventListener("click", async (ev) => {
  const b = ev.target.closest("button[data-f]"); if (!b) return;
  await db.from("of_fuentes").update({ activa: b.dataset.a === "true" }).eq("id", b.dataset.f); cargarFuentes();
});
$("#form-fuente").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const f = new FormData(ev.target);
  const { error } = await db.from("of_fuentes").insert({ plataforma: f.get("plataforma"), canal: f.get("canal").trim().replace(/^@/, "").toLowerCase(), campana_url: f.get("campana_url") || null });
  if (error) return alert(error.message);
  ev.target.reset(); cargarFuentes();
});

// ---------- pestañas ----------
function abrir(id) {
  document.querySelectorAll("[role=tab]").forEach((x) => x.setAttribute("aria-selected", x.dataset.vista === id));
  document.querySelectorAll(".vista").forEach((v) => v.classList.toggle("activa", v.id === id));
}
document.querySelectorAll("[role=tab]").forEach((b) => b.addEventListener("click", () => abrir(b.dataset.vista)));
$("#aviso-ver").addEventListener("click", () => $("#ir-ok").click());
$("#ir-ok").addEventListener("click", () => { abrir("aprobar"); $("#lateral").scrollIntoView({ behavior: "smooth", block: "start" }); });

// ---------- datos en vivo ----------
async function contarHoy() {
  const desde = new Date(Date.now() - 86400000).toISOString();
  const { count } = await db.from("of_clips").select("id", { count: "exact", head: true })
    .in("estado", ["esperando_ok", "aprobado", "publicado"]).gte("creado", desde);
  $("#n-hoy").textContent = `${count || 0}/${meta}`;
  $("#anillo").style.setProperty("--p", Math.min(100, ((count || 0) / meta) * 100));
}
async function iniciar() {
  const [{ data: ag }, { data: ev }, { data: ok }] = await Promise.all([
    db.from("of_agentes").select("*").order("orden"),
    db.from("of_eventos").select("*").order("id", { ascending: false }).limit(40),
    db.from("of_clips").select("*").eq("estado", "esperando_ok").order("creado"),
  ]);
  (ag || []).forEach(pintarAgente);
  $("#notas").innerHTML = (ev || []).length ? "" : VACIO("Todavía no hay actividad", "Aquí sale lo que va haciendo cada agente, en vivo.");
  (ev || []).forEach((e) => nota(e, false));
  clipsOk = ok || []; pintarAprobar(); cargarFuentes(); contarHoy();
  db.channel("oficina")
    .on("postgres_changes", { event: "*", schema: "public", table: "of_agentes" }, (p) => p.new?.id && pintarAgente(p.new))
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "of_eventos" }, (p) => {
      nota(p.new, true);
      if (p.new.tipo === "ok" && p.new.agente) enviarPaquete(p.new.agente);
    })
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "of_clips" }, (p) => {
      const c = p.new, esta = clipsOk.some((x) => x.id === c.id);
      if (c.estado === "esperando_ok" && !esta) { clipsOk.push(c); pintarAprobar(); }
      if (c.estado !== "esperando_ok" && esta) { clipsOk = clipsOk.filter((x) => x.id !== c.id); pintarAprobar(); }
      contarHoy();
    })
    .subscribe();
}

// ---------- sesión ----------
$("#form-entrar").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const f = new FormData(ev.target);
  const { error } = await db.auth.signInWithPassword({ email: f.get("email"), password: f.get("clave") });
  if (error) { $("#error-entrar").textContent = "No pude entrar: revisa el correo y la contraseña."; return; }
  $("#entrar").hidden = true; iniciar();
});

db.auth.getSession().then(({ data }) => {
  if (data.session) iniciar(); else $("#entrar").hidden = false;
});
</script>
